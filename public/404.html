<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Juan Priego — Portfolio</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a deep link like
      /juanca-portfolio/hobbies/some-post, or a hard refresh on that route),
      since it has no server to do real SPA rewrites. This stashes the intended
      path and redirects to the app root, which restores it via the script in
      index.html. See: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/juanca-portfolio/'" />
  </head>

</html>
